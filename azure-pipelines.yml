# =========================
# Azure DevOps Pipeline for Commuter Service
# =========================

trigger:
  branches:
    include:
      - main
      - feature/*

pr:
  branches:
    include:
      - main

pool:
  vmImage: 'ubuntu-latest'

variables:
  javaVersion: '17'
  artifactName: 'commuter-service'
  buildDir: '$(System.DefaultWorkingDirectory)/target'

stages:
# =========================
# 1️⃣ Build Stage
# =========================
- stage: Build
  displayName: 'Build Stage'
  jobs:
    - job: BuildJob
      displayName: 'Build Commuter Service'
      steps:
        # Checkout code
        - task: Checkout@1

        # Setup JDK
        - task: JavaToolInstaller@0
          inputs:
            versionSpec: '$(javaVersion)'
            jdkArchitecture: 'x64'
            jdkSourceOption: 'PreInstalled'

        # Cache Maven dependencies
        - task: Cache@2
          inputs:
            key: 'maven | "$(Agent.OS)" | **/pom.xml'
            restoreKeys: |
              maven | "$(Agent.OS)"
            path: ~/.m2/repository

        # Build with Maven
        - task: Maven@3
          displayName: 'Build with Maven'
          inputs:
            mavenPomFile: 'pom.xml'
            goals: 'clean package -DskipTests'

        # Publish build artifact
        - task: PublishBuildArtifacts@1
          displayName: 'Publish Artifact'
          inputs:
            PathtoPublish: '$(buildDir)'
            ArtifactName: '$(artifactName)'
            publishLocation: 'Container'


# =========================
# 2️⃣ Deploy to Dev/Test (Feature Branches)
# =========================
- stage: DeployDev
  displayName: 'Deploy to Dev/Test'
  dependsOn: Build
  condition: and(succeeded(), startsWith(variables['Build.SourceBranch'], 'refs/heads/feature/'))
  jobs:
    - job: DeployDevJob
      displayName: 'Deploy to Dev/Test App Service'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: DownloadBuildArtifacts@1
          inputs:
            buildType: 'current'
            downloadType: 'single'
            artifactName: '$(artifactName)'
            downloadPath: '$(System.DefaultWorkingDirectory)'

        - task: AzureWebApp@1
          displayName: 'Deploy to Dev/Test App Service'
          inputs:
            azureSubscription: 'Nivs Azure subscription'
            appName: 'commuter-service-app'
            package: '$(System.DefaultWorkingDirectory)/$(artifactName)/*.jar'


# =========================
# 3️⃣ Deploy to Prod (Main Branch)
# =========================
- stage: DeployProd
  displayName: 'Deploy to Production'
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))
  jobs:
    - job: DeployProdJob
      displayName: 'Deploy to Production App Service'
      pool:
        vmImage: 'ubuntu-latest'
      steps:
        - task: DownloadBuildArtifacts@1
          inputs:
            buildType: 'current'
            downloadType: 'single'
            artifactName: '$(artifactName)'
            downloadPath: '$(System.DefaultWorkingDirectory)'

        - task: AzureWebApp@1
          displayName: 'Deploy to Production App Service'
          inputs:
            azureSubscription: 'azure-busbuddy-connection'
            appName: 'commuter-service-app'
            package: '$(System.DefaultWorkingDirectory)/$(artifactName)/*.jar'
